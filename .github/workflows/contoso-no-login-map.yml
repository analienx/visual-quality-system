name: Contoso no-login map candidate QA

on:
  pull_request:
    paths:
      - ".github/workflows/contoso-no-login-map.yml"
      - "assets/maps/**"
      - "scripts/migrate_contoso_country_map.py"
      - "tests/test_contoso_no_login_map.py"
      - "tests/fixtures/contoso-retail-no-login-shapemap.*"
      - "tests/fixtures/contoso-country-legacy-visual.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-authoring:
    name: Contoso map candidate Microsoft oracle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install VQS and pinned official authoring CLI
        run: |
          python -m pip install .
          npm install --global @microsoft/powerbi-report-authoring-cli@0.5.0
      - name: Validate full candidate and adversarial refusal tests
        run: python -m pytest -q tests/test_contoso_no_login_map.py tests/test_world_shape_map_asset.py
