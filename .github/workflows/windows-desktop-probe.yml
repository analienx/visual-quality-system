name: Windows Desktop behaviour probe

# Engineering probe on a disposable runner against a copy of the fictional
# Contoso demo PBIP. Publishes a JSON summary only (no screenshots). Never
# report acceptance or G2/G4/G6 evidence.
on:
  push:
    paths:
      - ".github/workflows/windows-desktop-probe.yml"
      - "scripts/windows_desktop_probe.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install VQS and Desktop Bridge CLI
        run: |
          python -m pip install .
          npm install --global @microsoft/powerbi-desktop-bridge-cli
          npm install --global @microsoft/powerbi-report-authoring-cli@0.5.0
          powerbi-desktop --version
          powerbi-report-author --version
      - name: Install Power BI Desktop (silent)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $installed = $false
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget install --id Microsoft.PowerBI -e --source winget --silent `
              --accept-package-agreements --accept-source-agreements
            $installed = $LASTEXITCODE -eq 0
          }
          if (-not $installed) {
            $url = 'https://download.microsoft.com/download/8/8/0/880BCA75-79DD-466A-927D-1ABF1F5454B0/PBIDesktopSetup_x64.exe'
            $setup = Join-Path $env:RUNNER_TEMP 'PBIDesktopSetup_x64.exe'
            Invoke-WebRequest -Uri $url -OutFile $setup
            Start-Process -FilePath $setup -ArgumentList '-quiet','-norestart','ACCEPT_EULA=1' -Wait
          }
          Get-ChildItem 'C:\Program Files\Microsoft Power BI Desktop\bin\PBIDesktop.exe' -ErrorAction SilentlyContinue |
            Select-Object FullName, @{n='Version';e={$_.VersionInfo.ProductVersion}}
      - name: Probe Desktop behaviour
        env:
          PROBE_OUT: ${{ runner.temp }}\desktop-probe.json
        run: python scripts/windows_desktop_probe.py
      - name: Upload JSON summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-probe
          path: ${{ runner.temp }}\desktop-probe.json
          if-no-files-found: warn
