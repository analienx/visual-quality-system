name: P10 Polished Contoso Insights QA

on:
  pull_request:
    paths:
      - ".github/workflows/contoso-polished-insights.yml"
      - "scripts/migrate_contoso_insights_page.py"
      - "tests/test_contoso_polished_insights_p10.py"
      - "tests/test_world_shape_map_asset.py"
      - "tests/fixtures/contoso-retail-polished-insights-p10.*"
      - "tests/fixtures/contoso-insights-legacy-tree.json"
      - "assets/maps/**"
      - "assets/pbir/**"
      - "docs/assets/p10-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complete-contoso:
    name: Verified P10 Contoso candidate - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install VQS, official Microsoft authoring CLI and test runner
        run: |
          python -m pip install .
          python -m pip install pytest==8.4.2
          npm install --global @microsoft/powerbi-report-authoring-cli@0.5.0
      - name: Regenerate and validate complete Contoso candidate
        run: |
          python -m pytest -q tests/test_contoso_polished_insights_p10.py tests/test_world_shape_map_asset.py
