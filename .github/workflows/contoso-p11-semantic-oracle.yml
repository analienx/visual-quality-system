name: P11 Contoso executed-DAX oracle contract

on:
  pull_request:
    paths:
      - ".github/workflows/contoso-p11-semantic-oracle.yml"
      - "vqs/powerbi/contoso_runtime.py"
      - "scripts/contoso_p11_semantic_probe.py"
      - "tests/test_contoso_p11_semantic_oracle.py"
      - "tests/test_contoso_polished_insights_p10.py"
      - "tests/fixtures/contoso-retail-polished-insights-p10.manifest.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-contract:
    name: Semantic oracle negative controls - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install pytest==8.4.2 ruff==0.13.3
      - name: Test source-bound oracle and report invariants
        run: python -m pytest -q tests/test_contoso_p11_semantic_oracle.py tests/test_contoso_polished_insights_p10.py tests/test_world_shape_map_asset.py
      - name: Static Python review
        run: python -m ruff check vqs/powerbi/contoso_runtime.py scripts/contoso_p11_semantic_probe.py tests/test_contoso_p11_semantic_oracle.py
