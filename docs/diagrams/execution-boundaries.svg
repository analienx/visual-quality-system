<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1440" height="760" viewBox="0 0 1440 760">
<title id="title">VQS execution boundaries</title>
<desc id="desc">GitHub Actions and any supported computer run Python source checks without Desktop. An authorized interactive Windows Power BI Desktop host runs Microsoft Modeling MCP, Desktop Bridge and .NET Windows UI Automation. Optional WinApp CLI assists discovery only. Both streams feed source-bound evidence, which is separately reviewed and explicitly approved or blocked; Word DOCX and Fabric web are outside the Power BI release scope.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a182b"/><stop offset="1" stop-color="#112b42"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#19314a"/><stop offset="1" stop-color="#14293f"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#54a5ff"/><stop offset="1" stop-color="#52e0ce"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020d19" flood-opacity=".34"/></filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#69b8d9" stroke-width="1.5"/></marker>
  <style>
    text{font-family:'Segoe UI',Inter,Arial,sans-serif}
    .eyebrow{font-weight:700;font-size:17px;letter-spacing:2.7px;fill:#64dbce}
    .heading{font-weight:740;font-size:39px;letter-spacing:-1.2px;fill:#f2f8ff}
    .sub{font-size:19px;fill:#abc6dd}
    .stepnum{font-weight:750;font-size:15px;fill:#7bded7;letter-spacing:2px}
    .cardtitle{font-weight:710;font-size:24px;fill:#f3f8ff}
    .cardline{font-size:18px;fill:#b7cce0}
    .hint{font-size:16px;fill:#91b4cc}
    .smalltag{font-weight:700;font-size:13px;letter-spacing:1.6px;fill:#8ce8d9}
  </style>
</defs>
<rect width="1440" height="760" rx="25" fill="url(#bg)"/><rect x="1" y="1" width="1438" height="758" rx="24" fill="none" stroke="#395b78" stroke-opacity=".5"/>
<text x="58" y="62" class="eyebrow">02 / EXECUTION BOUNDARIES</text>
<text x="58" y="112" class="heading">Use the right machine. Keep one source of truth.</text>
<text x="58" y="148" class="sub">GitHub for portable proof · Windows for native pixels · people for release authority</text>
<rect x="58" y="205" width="623" height="332" rx="24" fill="url(#panel)" stroke="#436a90" stroke-width="2"/>
<rect x="759" y="205" width="623" height="332" rx="24" fill="url(#panel)" stroke="#387e88" stroke-width="2"/>
<rect x="85" y="229" width="185" height="31" rx="15" fill="#24456d"/><text x="177" y="250" text-anchor="middle" class="smalltag">PORTABLE / GITHUB CI</text>
<rect x="787" y="229" width="201" height="31" rx="15" fill="#1b5159"/><text x="888" y="250" text-anchor="middle" class="smalltag">WINDOWS / REAL DESKTOP</text>
<text x="90" y="303" class="cardtitle">Python VQS engine</text>
<text x="790" y="303" class="cardtitle">Authorized Power BI host</text>
<text x="90" y="348" class="cardline">PBIR + TMDL source facts</text>
<text x="90" y="383" class="cardline">Triaged defects · premium preflight</text>
<text x="90" y="418" class="cardline">Typed repair validation · unit tests</text>
<text x="90" y="453" class="cardline">Source hashes · tamper negatives</text>
<text x="90" y="497" class="hint">No real Desktop screenshots in a Linux runner.</text>
<text x="790" y="348" class="cardline">Modeling MCP → actual DAX answers</text>
<text x="790" y="383" class="cardline">Desktop Bridge → native screenshots</text>
<text x="790" y="418" class="cardline">.NET UIA → select, inspect, restore</text>
<text x="790" y="453" class="cardline">WinApp CLI → optional UIA diagnostics</text>
<text x="790" y="497" class="hint">Exact PID, saved identity, interactive state.</text>
<path d="M369 538V585H720" stroke="#68b2d0" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1070 538V585H720" stroke="#68b2d0" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="480" y="574" width="480" height="77" rx="22" fill="#1d4150" stroke="#4b98a2" stroke-width="2"/>
<text x="720" y="606" text-anchor="middle" class="cardtitle">Source-bound evidence</text>
<text x="720" y="633" text-anchor="middle" class="cardline">Real pixels + DAX + actions + digests</text>
<path d="M960 610H1040" stroke="#68b2d0" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1047" y="571" width="335" height="83" rx="22" fill="#274e50" stroke="#5ba589" stroke-width="2"/>
<text x="1073" y="604" class="cardtitle">Independent decision</text>
<text x="1073" y="633" class="cardline">Signed scope or BLOCKED</text>
<text x="58" y="715" class="hint">Outside Power BI core: Word/DOCX is a separate optional component; Fabric/web integration is deferred.</text>
<text x="58" y="742" class="hint">Remote Desktop Commander is an operator connection, not a VQS runtime requirement or an approval authority.</text>
</svg>