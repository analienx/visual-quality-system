<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1440" height="760" viewBox="0 0 1440 760">
<title id="title">VQS execution boundaries</title>
<desc id="desc">Published VQS v0.2.0 runs portable source checks, isolated candidate repairs and a static pull-request gate, recording a sealed stage ledger and a separate JSON result. Optional authorized Windows tools provide scoped DAX probes, source-bound captures and supported UIA observations on a separate native acceptance track. Source or capture binding does not prove equal data, and this version claims no G2, G4 or G6 report acceptance. Owner adoption is separate; Word DOCX is optional and Fabric web is deferred.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a182b"/><stop offset="1" stop-color="#112b42"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#19314a"/><stop offset="1" stop-color="#14293f"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#54a5ff"/><stop offset="1" stop-color="#52e0ce"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020d19" flood-opacity=".34"/></filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#69b8d9" stroke-width="1.5"/></marker>
  <style>
    text{font-family:'Segoe UI',Inter,Arial,sans-serif}
    .eyebrow{font-weight:700;font-size:17px;letter-spacing:2.7px;fill:#64dbce}
    .heading{font-weight:740;font-size:39px;letter-spacing:-1.2px;fill:#f2f8ff}
    .sub{font-size:19px;fill:#abc6dd}
    .stepnum{font-weight:750;font-size:15px;fill:#7bded7;letter-spacing:2px}
    .cardtitle{font-weight:710;font-size:24px;fill:#f3f8ff}
    .cardline{font-size:18px;fill:#b7cce0}
    .hint{font-size:16px;fill:#91b4cc}
    .smalltag{font-weight:700;font-size:13px;letter-spacing:1.6px;fill:#8ce8d9}
  </style>
</defs>
<rect width="1440" height="760" rx="25" fill="url(#bg)"/><rect x="1" y="1" width="1438" height="758" rx="24" fill="none" stroke="#395b78" stroke-opacity=".5"/>
<text x="58" y="62" class="eyebrow">02 / EXECUTION BOUNDARIES</text>
<text x="58" y="112" class="heading">One package. Separate evidence boundaries.</text>
<text x="58" y="148" class="sub">Published v0.2.0 for source changes · optional Windows lane for native observations</text>
<rect x="58" y="205" width="623" height="332" rx="24" fill="url(#panel)" stroke="#436a90" stroke-width="2"/>
<rect x="759" y="205" width="623" height="332" rx="24" fill="url(#panel)" stroke="#387e88" stroke-width="2"/>
<rect x="85" y="229" width="245" height="31" rx="15" fill="#24456d"/><text x="207" y="250" text-anchor="middle" class="smalltag">PORTABLE / PUBLISHED v0.2.0</text>
<rect x="787" y="229" width="284" height="31" rx="15" fill="#1b5159"/><text x="929" y="250" text-anchor="middle" class="smalltag">WINDOWS / SEPARATELY GATED</text>
<text x="90" y="303" class="cardtitle">Python VQS engine</text>
<text x="790" y="303" class="cardtitle">Authorized Power BI host</text>
<text x="90" y="348" class="cardline">PBIR + TMDL source checks</text>
<text x="90" y="383" class="cardline">Candidate-only repairs · static PR gate</text>
<text x="90" y="418" class="cardline">Source diff · remeasure · negative controls</text>
<text x="90" y="453" class="cardline">Sealed stage ledger · full JSON separate</text>
<text x="90" y="497" class="hint">No Desktop needed for this source workflow.</text>
<text x="790" y="348" class="cardline">Modeling MCP → scoped DAX probes</text>
<text x="790" y="383" class="cardline">Desktop Bridge → source-bound captures</text>
<text x="790" y="418" class="cardline">.NET UIA → supported observations</text>
<text x="790" y="453" class="cardline">WinApp CLI → optional UIA diagnostics</text>
<text x="790" y="497" class="hint">Exact PID and scope are not data-equality proof.</text>
<path d="M369 538V566" stroke="#68b2d0" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1070 538V566" stroke="#68b2d0" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="58" y="577" width="623" height="86" rx="22" fill="#1d4150" stroke="#4b98a2" stroke-width="2"/>
<text x="369" y="610" text-anchor="middle" class="cardtitle">Stage ledger + result</text>
<text x="369" y="640" text-anchor="middle" class="cardline">Full returned JSON via --report-out</text>
<rect x="759" y="577" width="623" height="86" rx="22" fill="#213d4b" stroke="#427486" stroke-width="2"/>
<text x="1070" y="610" text-anchor="middle" class="cardtitle">Native observations</text>
<text x="1070" y="640" text-anchor="middle" class="cardline">No G2/G4/G6 acceptance claimed</text>
<text x="58" y="715" class="hint">Owner-authorized static adoption is separate from native report acceptance; missing native proof stays BLOCKED.</text>
<text x="58" y="742" class="hint">Word/DOCX is a separate optional component. Fabric/web is deferred. Operator access is not approval authority.</text>
</svg>
