<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1444" viewBox="0 0 720 1444" role="img" aria-labelledby="title description">
  <title id="title">VQS v0.2.0: source checks, candidate repair and owner review</title>
  <desc id="description">The released local CLI/MCP reads PBIP source, checks PBIR and TMDL with pinned authoring validation, repairs a separate candidate and rechecks supported static properties. It presents candidate changes and a sealed stage ledger for owner review, or questions and missing evidence that need attention. Unanswered questions retain their options; oversized results require full JSON. Adoption requires explicit owner authorization. Native Desktop and data-parity acceptance remain a separate v0.3 track. Compare-renders is experimental and always overall blocked in v0.2.0.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9bb0ce" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="720" height="1444" rx="24" fill="#0b1220"/>
  <rect x="32" y="32" width="7" height="118" rx="3" fill="#43d1b4"/>
  <text x="54" y="58" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#7be4d0" letter-spacing="1">VQS v0.2.0 · RELEASED</text>
  <text x="52" y="110" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700" fill="#f8fafc">Inspect. Repair a copy.</text>
  <text x="54" y="152" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#cbd5e1">Static scope · separate candidates</text>

  <rect x="28" y="188" width="664" height="122" rx="18" fill="#1c2a3d" stroke="#4c6486" stroke-width="2"/>
  <rect x="50" y="212" width="60" height="64" rx="15" fill="#354b69"/>
  <text x="80" y="256" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#eff6ff">1</text>
  <text x="130" y="234" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#f8fafc">Start with your PBIP</text>
  <text x="130" y="278" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#d8e3ef">vqs fix · local CLI / MCP</text>
  <path d="M360 315 V346" fill="none" stroke="#9bb0ce" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="28" y="362" width="664" height="140" rx="18" fill="#19293a" stroke="#5686a5" stroke-width="2"/>
  <rect x="50" y="386" width="60" height="64" rx="15" fill="#274663"/>
  <text x="80" y="430" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#eff6ff">2</text>
  <text x="130" y="405" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#f8fafc">Check the source</text>
  <text x="130" y="447" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#d8e3ef">PBIR / TMDL + pinned validator</text>
  <text x="130" y="484" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#acc5d7">Findings bound to a revision</text>
  <path d="M360 507 V538" fill="none" stroke="#9bb0ce" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="28" y="554" width="664" height="140" rx="18" fill="#102f42" stroke="#32b4cc" stroke-width="2"/>
  <rect x="50" y="578" width="60" height="64" rx="15" fill="#16586a"/>
  <text x="80" y="622" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#e5fcff">3</text>
  <text x="130" y="597" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#f8fafc">Repair a separate copy</text>
  <text x="130" y="639" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#d8f6fa">Typed edits · original unchanged</text>
  <text x="130" y="676" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#b2dfe7">Recheck supported static properties</text>
  <path d="M360 699 V730" fill="none" stroke="#9bb0ce" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="28" y="746" width="664" height="140" rx="18" fill="#1c2a3d" stroke="#7286a5" stroke-width="2"/>
  <rect x="50" y="770" width="60" height="64" rx="15" fill="#354b69"/>
  <text x="80" y="814" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#eff6ff">4</text>
  <text x="130" y="789" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#f8fafc">Review the result</text>
  <text x="130" y="831" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#d8e3ef">Changes + sealed stage ledger</text>
  <text x="130" y="868" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#acc5d7">Questions keep the owner in control</text>
  <path d="M360 891 V914" fill="none" stroke="#9bb0ce" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="28" y="930" width="664" height="112" rx="18" fill="#133b33" stroke="#38b88d" stroke-width="2"/>
  <text x="52" y="973" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#b3f0d9">Verified static candidate</text>
  <text x="52" y="1014" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#def6eb">Adopt only with explicit owner approval</text>
  <text x="360" y="1077" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#9bb0ce">OR</text>
  <rect x="28" y="1098" width="664" height="130" rx="18" fill="#392c1d" stroke="#d9a44b" stroke-width="2"/>
  <text x="52" y="1140" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#ffdb9a">Needs a decision or evidence</text>
  <text x="52" y="1181" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#f3e2c7">Every unanswered question keeps its options</text>
  <text x="52" y="1215" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#e5cba5">Oversized result? Read the full JSON.</text>

  <rect x="28" y="1254" width="664" height="160" rx="18" fill="#182131" stroke="#52637d" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="52" y="1297" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#d5e1f0">Native / v0.3 acceptance track</text>
  <text x="52" y="1338" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#b7c6db">Desktop + data parity need more proof</text>
  <text x="52" y="1377" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#b7c6db">compare-renders stays blocked in v0.2</text>
</svg>
