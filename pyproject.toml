[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-quality-system"
version = "0.0.1a0"
description = "Source-grounded visual quality evidence and design policy engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "VQS contributors"}]
dependencies = []
classifiers = ["Development Status :: 2 - Pre-Alpha", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
vqs = "vqs.cli:main"
vqs-mcp = "vqs.mcp.server:main"

[tool.setuptools.packages.find]
include = ["vqs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
